# See the pacman.conf(5) manpage for option and repository directives

[options]
# simba-noextract (Simba OS): documentação e traduções fora pt/en
NoExtract = usr/share/doc/* usr/share/gtk-doc/*
NoExtract = usr/share/help/* !usr/share/help/C/* !usr/share/help/pt_BR/* !usr/share/help/pt/*
NoExtract = usr/share/locale/* !usr/share/locale/pt_BR/* !usr/share/locale/pt/* !usr/share/locale/en/* !usr/share/locale/en_US/* !usr/share/locale/en_GB/* !usr/share/locale/locale.alias
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# pacman searches repositories in the order defined here
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist


# Atualizações do Simba OS (apps, Draco, sistema base). Assinado pela chave do
# simba-keyring; sem esta seção o sistema para de receber o Simba.
[simba-os]
SigLevel = Required DatabaseRequired
Server = https://github.com/SIMBA_GH_USER/simba-os/releases/download/repo
