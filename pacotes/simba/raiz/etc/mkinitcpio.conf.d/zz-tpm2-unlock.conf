# Desbloqueio LUKS via TPM2: troca os hooks busybox pelos equivalentes systemd.
# Lido depois de simba_hooks.conf e simba_resume.conf.
_new=()
for _h in "${HOOKS[@]}"; do
  case $_h in
    udev) _new+=(systemd) ;;
    keymap) _new+=(sd-vconsole) ;;
    consolefont|resume) ;;
    encrypt) _new+=(sd-encrypt) ;;
    btrfs-overlayfs) _new+=(sd-btrfs-overlayfs) ;;
    *) _new+=("$_h") ;;
  esac
done
HOOKS=("${_new[@]}")
unset _new _h
