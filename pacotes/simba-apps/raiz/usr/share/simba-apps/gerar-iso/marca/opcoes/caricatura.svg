<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <filter id="lapis" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hachura" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="9" height="9" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#8c8c8c" stroke-width="3"/>
    </pattern>
    <pattern id="pelo" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="14" height="14" fill="#d6d6d4"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#c4c4c2" stroke-width="4"/>
    </pattern>
  </defs>
  <g filter="url(#lapis)" stroke="#151515" stroke-linecap="round" stroke-linejoin="round">
    <!-- orelhas (a esquerda um pouco mais aberta, como na foto) -->
    <path d="M255 420 C 222 300, 205 190, 222 100 C 295 140, 362 205, 412 280 Z" fill="url(#pelo)" stroke-width="16"/>
    <path d="M748 425 C 782 305, 800 205, 785 118 C 712 155, 642 215, 590 285 Z" fill="url(#pelo)" stroke-width="16"/>
    <path d="M272 372 C 258 292, 252 222, 260 168 C 305 205, 343 248, 370 295" fill="url(#hachura)" stroke-width="7"/>
    <path d="M730 375 C 746 298, 752 232, 746 182 C 700 214, 662 254, 633 298" fill="url(#hachura)" stroke-width="7"/>
    <!-- cabeça larga com tufos nas bochechas -->
