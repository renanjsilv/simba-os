# Simba OS: o logo fica na tela até a tela de entrada (SDDM) desenhar por cima. O padrão
# fechava o Plymouth antes de o SDDM começar e a tela ficava preta por vários segundos
# (no 1º boot depois de instalar, bem mais), parecendo travado.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
