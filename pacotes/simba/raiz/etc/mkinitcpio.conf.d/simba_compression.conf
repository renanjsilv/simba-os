# Simba OS — Otimização de compressão multithread para o initramfs
# -T0 utiliza todos os núcleos da CPU disponíveis.
# -19 oferece compressão zstd máxima, reduzindo em até 40% o tamanho da imagem de boot
# e proporcionando descompressão instantânea em SSDs e NVMe.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0 -19)
