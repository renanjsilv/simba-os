# Simba OS: mesma política do "Atualizar tudo" (simba-update-pkg-prune): duas versões de cada
# pacote instalado (caminho de volta sem internet) e só a última dos que foram desinstalados.
[Service]
ExecStart=
ExecStart=/usr/bin/paccache -rk2 $PACCACHE_ARGS
ExecStart=/usr/bin/paccache -ruk1 $PACCACHE_ARGS
